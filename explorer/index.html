<!doctype html>
<meta charset="utf-8">
<title>Results explorer</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: #fff; color: #000;
         display: grid; grid-template-columns: min(720px, 50vw) 1fr; height: 100vh; }
  #list { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid #ddd; }
  #bar { padding: 8px; background: #fafafa; border-bottom: 1px solid #ddd; }
  #count, .empty { color: #666; }
  #table { flex: 1; overflow: auto; }
  #detail { overflow: auto; padding: 8px 16px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 3px 6px; text-align: left; border-bottom: 1px solid #eee; white-space: nowrap; }
  th { position: sticky; top: 0; background: #fff; box-shadow: inset 0 -1px #ddd; cursor: pointer; user-select: none; }
  .mark { text-align: center; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: #1a7f37; }
  .no { color: #cf222e; }
  .na { color: #999; }
  td.id { max-width: 250px; overflow: hidden; text-overflow: ellipsis; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f4f4f4; }
  tr.selected { background: #e3ecfb; }
  h3 { font-size: 15px; font-weight: 600; margin: 6px 0 4px; overflow-wrap: anywhere; }
  .label { font-size: 12px; color: #666; margin: 14px 0 4px; }
  pre { margin: 0; background: #f6f6f6; padding: 8px; border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere;
        font: 12.5px/1.45 ui-monospace, Consolas, monospace; }
  mark { background: #fff3b0; }
</style>
<div id="list">
  <div id="bar">
    <select id="run"></select> Show <select id="show"></select> <span id="count"></span>
  </div>
  <div id="table">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
<div id="detail"><p class="empty">Select an item.</p></div>
<script>
const MODES = ["strict", "relaxed", "normalized"];
const MARK = {true: "✓", false: "✗", null: "–"};
const MARK_CLASS = {true: "mark ok", false: "mark no", null: "mark na"};
// Filters use normalized scoring. Truncated: the response ended before an answer (token limit).
const FILTERS = {
  all: () => true,
  correct: item => item.correct.normalized === true,
  incorrect: item => item.correct.normalized === false,
  truncated: item => item.status.normalized === "request_incomplete",
};
const COLUMNS = [
  {label: "#", title: "Position in the run; stays with the item when filtering or sorting", value: i => i.number, cls: "num"},
  {label: "Dataset", value: i => i.dataset},
  {label: "Item", value: i => i.id, cls: "id"},
  ...MODES.map(m => ({label: m[0].toUpperCase() + m.slice(1), value: i => i.correct[m], show: v => MARK[v],
                      cls: "mark", cellClass: v => MARK_CLASS[v]})),
  {label: "Logprob", title: "Mean log-probability of the answer tokens",
   value: i => i.logprob, show: v => v === null ? "" : v.toExponential(1), cls: "num"},
  {label: "Reasoning tokens", value: i => i.reasoning_tokens, show: v => v ?? "", cls: "num"},
];
const $ = id => document.getElementById(id);
let items = [], sortColumn = null, descending = false;

// Options carry counts for the loaded run.
function refreshShow() {
  const keep = $("show").value || "all";
  $("show").replaceChildren(...Object.keys(FILTERS).map(f =>
    new Option(`${f} (${items.filter(FILTERS[f]).length})`, f)));
  $("show").value = keep;
}

// Missing values sort last in either direction; ids compare with their numbers ("sample_2" < "sample_10").
function compare(a, b) {
  if (a === b) return 0;
  if (a === null || a === undefined) return 1;
  if (b === null || b === undefined) return -1;
  const order = typeof a === "string" ? a.localeCompare(b, undefined, {numeric: true}) : (a < b ? -1 : 1);
  return descending ? -order : order;
}

function renderHead() {
  $("head").replaceChildren(...COLUMNS.map(column => {
    const th = document.createElement("th");
    th.textContent = column.label + (column === sortColumn ? (descending ? " ▼" : " ▲") : "");
    th.className = column.cls ?? "";
    if (column.title) th.title = column.title;
    th.onclick = () => {
      descending = column === sortColumn ? !descending : false;
      sortColumn = column;
      renderHead();
      render();
    };
    return th;
  }));
}

function render() {
  const shown = items.filter(FILTERS[$("show").value]);
  if (sortColumn) shown.sort((a, b) => compare(sortColumn.value(a), sortColumn.value(b)));
  $("count").textContent = `${shown.length} of ${items.length} items`;
  const rows = $("rows");
  rows.replaceChildren();
  for (const item of shown) {
    const tr = rows.insertRow();
    for (const column of COLUMNS) {
      const cell = tr.insertCell();
      const value = column.value(item);
      cell.textContent = column.show ? column.show(value) : value;
      cell.className = column.cellClass ? column.cellClass(value) : column.cls ?? "";
    }
    tr.cells[COLUMNS.findIndex(c => c.cls === "id")].title = item.id;
    tr.onclick = () => {
      rows.querySelector(".selected")?.classList.remove("selected");
      tr.classList.add("selected");
      showItem(item);
    };
  }
}

function showItem(item) {
  const detail = $("detail");
  detail.replaceChildren();
  const heading = document.createElement("h3");
  heading.textContent = `#${item.number}  ${item.dataset} / ${item.id}`;
  detail.append(heading);
  for (const [label, text] of [["Code", item.code], ["Input", item.input], ["Reference", item.reference],
                               ["Response", item.response ?? "(no response)"],
                               ["Reasoning", item.reasoning ?? "(none)"]]) {
    const caption = document.createElement("div");
    const pre = document.createElement("pre");
    caption.className = "label";
    caption.textContent = label;
    if (label === "Response") appendHighlighted(pre, text);
    else pre.textContent = text;
    detail.append(caption, pre);
  }
}

// Mark the <prediction> blocks so the answer stands out in long responses.
function appendHighlighted(pre, text) {
  let last = 0;
  for (const match of text.matchAll(/<prediction>[\s\S]*?<\/prediction>/g)) {
    const mark = document.createElement("mark");
    mark.textContent = match[0];
    pre.append(text.slice(last, match.index), mark);
    last = match.index + match[0].length;
  }
  pre.append(text.slice(last));
}

async function loadRun(run) {
  items = await (await fetch("/api/runs/" + run)).json();
  items.forEach((item, index) => item.number = index + 1);
  refreshShow();
  render();
  $("detail").innerHTML = '<p class="empty">Select an item.</p>';
}

(async () => {
  renderHead();
  for (const run of await (await fetch("/api/runs")).json()) $("run").add(new Option(run, run));
  $("run").onchange = () => loadRun($("run").value);
  $("show").onchange = render;
  if ($("run").value) loadRun($("run").value);
})();
</script>
