<!doctype html>
<meta charset="utf-8">
<title>Results explorer</title>
<style>
  :root { color-scheme: dark;
          --page: #0d1117; --panel: #161b22; --code: #1c2128; --line: #30363d; --row-line: #21262d;
          --text: #e6edf3; --soft: #c9d1d9; --muted: #8b949e; --hover: #161b22; --selected: #1f3a5f;
          --ok: #3fb950; --no: #f85149; --na: #6e7681; --bar: #4c8ed9; --mark: #5c4813; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: var(--page); color: var(--text);
         display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  #tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
  #tabs button { font: inherit; padding: 4px 14px; margin-bottom: -1px; border: 1px solid transparent; border-bottom: none;
                 border-radius: 4px 4px 0 0; background: none; color: var(--muted); cursor: pointer; }
  #tabs button.active { background: var(--page); border-color: var(--line); color: var(--text); }
  main { display: grid; grid-template-columns: min(720px, 50vw) 1fr; min-height: 0; }
  .list { display: flex; flex-direction: column; min-height: 0; overflow: hidden; border-right: 1px solid var(--line); }
  .list[hidden] { display: none; }
  .bar { padding: 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .muted, .empty { color: var(--muted); }
  .scroll { flex: 1; overflow: auto; }
  #detail { overflow: auto; padding: 8px 16px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 3px 6px; text-align: left; border-bottom: 1px solid var(--row-line); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--page); box-shadow: inset 0 -1px var(--line); cursor: pointer; user-select: none; }
  .mark { text-align: center; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); }
  .no { color: var(--no); }
  .na { color: var(--na); }
  td.id { max-width: 250px; overflow: hidden; text-overflow: ellipsis; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  tr.selected { background: var(--selected); }
  #summary { padding: 8px 8px 0; font-size: 13px; }
  #charts { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 8px; }
  .chart-title { font-size: 12px; color: var(--soft); margin-bottom: 2px; }
  .chart text { font-size: 10px; fill: var(--muted); }
  .chart rect { fill: var(--bar); }
  h3 { font-size: 15px; font-weight: 600; margin: 6px 0 4px; overflow-wrap: anywhere; }
  .facts { font-size: 13px; color: var(--soft); }
  .label { font-size: 12px; color: var(--muted); margin: 14px 0 4px; }
  pre { margin: 0; background: var(--code); padding: 8px; border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere;
        font: 12.5px/1.45 ui-monospace, Consolas, monospace; }
  mark { background: var(--mark); color: inherit; }
</style>
<nav id="tabs">
  <button data-view="results" class="active">Predictions</button>
  <button data-view="confidence">Confidence</button>
  <button data-view="dataset">Dataset</button>
</nav>
<main>
  <div id="results" class="list">
    <div class="bar">
      <select id="run"></select> Show <select id="show"></select> <span id="count" class="muted"></span>
    </div>
    <div class="scroll">
      <table><thead><tr id="results-head"></tr></thead><tbody id="results-rows"></tbody></table>
    </div>
  </div>
  <div id="confidence" class="list" hidden>
    <div class="bar">
      <select id="verify-run"></select> Show <select id="verify-show"></select> <span id="verify-count" class="muted"></span>
    </div>
    <div class="scroll">
      <table><thead><tr id="confidence-head"></tr></thead><tbody id="confidence-rows"></tbody></table>
    </div>
  </div>
  <div id="dataset" class="list" hidden>
    <div class="bar"><select id="dataset-name"></select></div>
    <div class="scroll">
      <div id="summary" class="muted"></div>
      <div id="charts"></div>
      <table><thead><tr id="dataset-head"></tr></thead><tbody id="dataset-rows"></tbody></table>
    </div>
  </div>
  <div id="detail"><p class="empty">Select an item.</p></div>
</main>
<script>
const $ = id => document.getElementById(id);
const MODES = ["strict", "relaxed", "normalized"];
const MARK = {true: "✓", false: "✗", null: "–"};
const MARK_CLASS = {true: "mark ok", false: "mark no", null: "mark na"};
// Filters use normalized scoring. Truncated: the response ended before an answer (token limit).
const FILTERS = {
  all: () => true,
  correct: item => item.correct.normalized === true,
  incorrect: item => item.correct.normalized === false,
  truncated: item => item.status.normalized === "request_incomplete",
};
const NUMBER = {label: "#", title: "Position in the run or dataset; stays with the item when filtering or sorting",
                value: i => i.number, cls: "num"};
const RESULT_COLUMNS = [
  NUMBER,
  {label: "Dataset", value: i => i.dataset},
  {label: "Item", value: i => i.id, cls: "id"},
  ...MODES.map(m => ({label: m[0].toUpperCase() + m.slice(1), value: i => i.correct[m], show: v => MARK[v],
                      cls: "mark", cellClass: v => MARK_CLASS[v]})),
  {label: "Logprob", title: "Mean log-probability of the answer tokens",
   value: i => i.logprob, show: v => v === null ? "" : v.toExponential(1), cls: "num"},
  {label: "Reasoning tokens", value: i => i.reasoning_tokens, show: v => v ?? "", cls: "num"},
];
// The verifier's verdict against the answer's actual correctness (normalized scoring).
const VERDICT_FILTERS = {
  all: () => true,
  "approved, right": i => i.verdict === "correct" && i.correct === true,
  "approved, wrong": i => i.verdict === "correct" && i.correct === false,
  "rejected, right": i => i.verdict === "incorrect" && i.correct === true,
  "rejected, wrong": i => i.verdict === "incorrect" && i.correct === false,
  "no judgment": i => i.verdict === null,
};
const CONFIDENCE_COLUMNS = [
  NUMBER,
  {label: "Dataset", value: i => i.dataset},
  {label: "Item", value: i => i.id, cls: "id"},
  {label: "Answer", title: "Answer correct (normalized scoring)", value: i => i.correct, show: v => MARK[v],
   cls: "mark", cellClass: v => MARK_CLASS[v]},
  {label: "Logprob", title: "Implicit: mean log-probability of the answer tokens",
   value: i => i.logprob, show: v => v === null ? "" : v.toExponential(1), cls: "num"},
  {label: "Reasoning tokens", title: "Behavioural: reasoning tokens spent on the answer",
   value: i => i.reasoning_tokens, show: v => v ?? "", cls: "num"},
  {label: "Verdict", title: "Explicit: the model's verdict on its own answer", value: i => i.verdict, show: v => v ?? ""},
  {label: "Confidence", title: "Explicit: stated probability (0-100) that the answer is correct",
   value: i => i.confidence, show: v => v ?? "", cls: "num"},
  {label: "P(correct)", title: "Explicit: probability the model gave the verdict word \"correct\"",
   value: i => i.p_correct, show: v => v === null ? "" : v.toFixed(3), cls: "num"},
];
const DATASET_COLUMNS = [
  NUMBER,
  {label: "Item", value: i => i.id, cls: "id"},
  {label: "Source", value: i => i.source},
  {label: "Code tokens", value: i => i.code_token_length, cls: "num"},
  {label: "Input tokens", value: i => i.input_token_length, cls: "num"},
  {label: "Lines", title: "Executable lines", value: i => i.executable_lines, show: v => v ?? "", cls: "num"},
  {label: "Labels", title: "RE2 helper labels removed before counting lines", value: i => i.helper_labels_excluded, cls: "num"},
  {label: "Parse", title: "ok, lexical_only (counted but not valid Python) or tokenization_failed (no line count)",
   value: i => i.line_status},
];

// A table sorted by clicking headers; missing values sort last, ids compare with their numbers.
function sortableTable(head, body, columns, onSelect) {
  let sortColumn = null, descending = false, items = [];
  const compare = (a, b) => {
    if (a === b) return 0;
    if (a === null || a === undefined) return 1;
    if (b === null || b === undefined) return -1;
    const order = typeof a === "string" ? a.localeCompare(b, undefined, {numeric: true}) : (a < b ? -1 : 1);
    return descending ? -order : order;
  };
  function renderHead() {
    head.replaceChildren(...columns.map(column => {
      const th = document.createElement("th");
      th.textContent = column.label + (column === sortColumn ? (descending ? " ▼" : " ▲") : "");
      th.className = column.cls ?? "";
      if (column.title) th.title = column.title;
      th.onclick = () => {
        descending = column === sortColumn ? !descending : false;
        sortColumn = column;
        renderHead();
        render();
      };
      return th;
    }));
  }
  function render(newItems) {
    if (newItems) items = newItems;
    const shown = sortColumn ? [...items].sort((a, b) => compare(sortColumn.value(a), sortColumn.value(b))) : items;
    body.replaceChildren();
    for (const item of shown) {
      const tr = body.insertRow();
      for (const column of columns) {
        const cell = tr.insertCell();
        const value = column.value(item);
        cell.textContent = column.show ? column.show(value) : value;
        cell.className = column.cellClass ? column.cellClass(value) : column.cls ?? "";
        if (column.cls === "id") cell.title = value;
      }
      tr.onclick = () => {
        body.querySelector(".selected")?.classList.remove("selected");
        tr.classList.add("selected");
        onSelect(item);
      };
    }
  }
  renderHead();
  return {render};
}

function showDetail(title, facts, sections) {
  const detail = $("detail");
  detail.replaceChildren();
  const heading = document.createElement("h3");
  heading.textContent = title;
  detail.append(heading);
  if (facts) {
    const line = document.createElement("div");
    line.className = "facts";
    line.textContent = facts;
    detail.append(line);
  }
  for (const [label, text, highlight] of sections) {
    const caption = document.createElement("div");
    const pre = document.createElement("pre");
    caption.className = "label";
    caption.textContent = label;
    if (highlight) appendHighlighted(pre, text);
    else pre.textContent = text;
    detail.append(caption, pre);
  }
}

function clearDetail() {
  $("detail").innerHTML = '<p class="empty">Select an item.</p>';
}

// Mark the <prediction> blocks so the answer stands out in long responses.
function appendHighlighted(pre, text) {
  let last = 0;
  for (const match of text.matchAll(/<prediction>[\s\S]*?<\/prediction>/g)) {
    const mark = document.createElement("mark");
    mark.textContent = match[0];
    pre.append(text.slice(last, match.index), mark);
    last = match.index + match[0].length;
  }
  pre.append(text.slice(last));
}

// --- predictions tab -----------------------------------------------------------

let results = [];
const resultsTable = sortableTable($("results-head"), $("results-rows"), RESULT_COLUMNS, item =>
  showDetail(`#${item.number}  ${item.dataset} / ${item.id}`, null,
             [["Code", item.code], ["Input", item.input], ["Reference", item.reference],
              ["Response", item.response ?? "(no response)", true], ["Reasoning", item.reasoning ?? "(none)"]]));

function renderResults() {
  const shown = results.filter(FILTERS[$("show").value]);
  $("count").textContent = `${shown.length} of ${results.length} items`;
  resultsTable.render(shown);
}

async function loadRun(run) {
  results = await (await fetch("/api/runs/" + run)).json();
  results.forEach((item, index) => item.number = index + 1);
  const keep = $("show").value || "all";
  $("show").replaceChildren(...Object.keys(FILTERS).map(f =>
    new Option(`${f} (${results.filter(FILTERS[f]).length})`, f)));
  $("show").value = keep;
  renderResults();
  clearDetail();
}

// --- confidence tab ------------------------------------------------------------

let judged = [];
const confidenceTable = sortableTable($("confidence-head"), $("confidence-rows"), CONFIDENCE_COLUMNS, item => {
  const facts = [`answer ${item.correct ? "correct" : "incorrect"}`, `verdict ${item.verdict ?? item.status}`,
                 `confidence ${item.confidence ?? "–"}`, `P(correct) ${item.p_correct === null ? "–" : item.p_correct.toFixed(3)}`,
                 `logprob ${item.logprob === null ? "–" : item.logprob.toExponential(2)}`,
                 `reasoning tokens ${item.reasoning_tokens ?? "–"} (verifier ${item.verifier_reasoning_tokens ?? "–"})`];
  showDetail(`#${item.number}  ${item.dataset} / ${item.id}`, facts.join(" · "),
             [["Code", item.code], ["Input", item.input], ["Reference", item.reference],
              ["Response", item.response ?? "(no response)", true], ["Verifier response", item.verifier_response ?? "(none)"]]);
});

function renderConfidence() {
  const shown = judged.filter(VERDICT_FILTERS[$("verify-show").value]);
  $("verify-count").textContent = `${shown.length} of ${judged.length} judged answers`;
  confidenceTable.render(shown);
}

async function loadVerification(run) {
  judged = await (await fetch("/api/verifications/" + run)).json();
  judged.forEach((item, index) => item.number = index + 1);
  const keep = $("verify-show").value || "all";
  $("verify-show").replaceChildren(...Object.keys(VERDICT_FILTERS).map(f =>
    new Option(`${f} (${judged.filter(VERDICT_FILTERS[f]).length})`, f)));
  $("verify-show").value = keep;
  renderConfidence();
  clearDetail();
}

// --- dataset tab ---------------------------------------------------------------

const datasetTable = sortableTable($("dataset-head"), $("dataset-rows"), DATASET_COLUMNS, item => {
  const facts = [`source ${item.source}`, `${item.code_token_length} code tokens`, `${item.input_token_length} input tokens`,
                 `${item.executable_lines ?? "no"} executable lines`, `${item.helper_labels_excluded} helper labels removed`,
                 `parse ${item.line_status}` + (item.line_detail ? ` (${item.line_detail})` : "")];
  showDetail(`#${item.number}  ${item.id}`, facts.join(" · "),
             [["Code", item.code], ["Input", item.input], ["Reference", item.reference]]);
});

const compact = n => n >= 1000 ? `${+(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : String(n);

// Bins double in width when values span more than ~50x (RE2's long tail), else ~12 equal bins.
function histogram(title, values) {
  values = values.filter(v => v !== null);
  const min = Math.min(...values), max = Math.max(...values);
  const log = max / Math.max(min, 1) > 50;
  const edges = [];
  if (log) {
    if (min < 1) edges.push(0);
    for (let e = 2 ** Math.floor(Math.log2(Math.max(min, 1))); e <= max; e *= 2) edges.push(e);
  } else {
    const width = Math.max(1, Math.ceil((max - min + 1) / 12));
    for (let e = min; e <= max; e += width) edges.push(e);
  }
  edges.push(log ? edges.at(-1) * 2 : edges.at(-1) + (edges[1] - edges[0] || 1));
  const counts = edges.slice(0, -1).map((low, i) => values.filter(v => v >= low && v < edges[i + 1]).length);
  const width = 330, height = 120, top = 12, bottom = 16, step = width / counts.length, peak = Math.max(...counts);
  const labelEvery = step < 24 ? 2 : 1;
  const svg = [`<svg class="chart" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`];
  counts.forEach((count, i) => {
    const h = peak ? count / peak * (height - top - bottom) : 0, x = i * step, y = height - bottom - h;
    const range = log ? `${compact(edges[i])}–${compact(edges[i + 1])}`
                : edges[i + 1] - edges[i] === 1 ? `${edges[i]}` : `${edges[i]}–${edges[i + 1] - 1}`;
    svg.push(`<rect x="${x + 1}" y="${y}" width="${step - 2}" height="${h}"><title>${range}: ${count}</title></rect>`);
    if (count) svg.push(`<text x="${x + step / 2}" y="${y - 2}" text-anchor="middle">${count}</text>`);
    if (i % labelEvery === 0) svg.push(`<text x="${x + step / 2}" y="${height - 4}" text-anchor="middle">${compact(edges[i])}</text>`);
  });
  svg.push("</svg>");
  const chart = document.createElement("div");
  chart.innerHTML = `<div class="chart-title">${title}${log ? " (bins double in width)" : ""}</div>${svg.join("")}`;
  return chart;
}

function tally(values) {
  const counts = {};
  for (const v of values) counts[v] = (counts[v] ?? 0) + 1;
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${k} ${n}`).join(", ");
}

async function loadDataset(name) {
  const programs = await (await fetch("/api/datasets/" + name)).json();
  programs.forEach((item, index) => item.number = index + 1);
  const median = key => {
    const v = programs.map(p => p[key]).filter(x => x !== null).sort((a, b) => a - b);
    return v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2;
  };
  $("summary").textContent = [`${programs.length} programs`, `sources: ${tally(programs.map(p => p.source))}`,
                              `parse: ${tally(programs.map(p => p.line_status))}`,
                              `median ${median("code_token_length")} code tokens, ${median("executable_lines")} lines`].join(" · ");
  $("charts").replaceChildren(histogram("Code tokens", programs.map(p => p.code_token_length)),
                              histogram("Executable lines", programs.map(p => p.executable_lines)),
                              histogram("Input tokens", programs.map(p => p.input_token_length)));
  datasetTable.render(programs);
  clearDetail();
}

// --- start ---------------------------------------------------------------------

// Tabs other than the first load their data when first opened.
const FIRST_OPEN = {confidence: () => $("verify-run").value && loadVerification($("verify-run").value),
                    dataset: () => loadDataset($("dataset-name").value)};
for (const button of document.querySelectorAll("#tabs button")) {
  button.onclick = () => {
    for (const other of document.querySelectorAll("#tabs button")) {
      other.classList.toggle("active", other === button);
      $(other.dataset.view).hidden = other !== button;
    }
    clearDetail();
    FIRST_OPEN[button.dataset.view]?.();
    delete FIRST_OPEN[button.dataset.view];
  };
}

(async () => {
  for (const run of await (await fetch("/api/runs")).json()) $("run").add(new Option(run, run));
  for (const run of await (await fetch("/api/verifications")).json()) $("verify-run").add(new Option(run, run));
  for (const name of await (await fetch("/api/datasets")).json()) $("dataset-name").add(new Option(name, name));
  $("run").onchange = () => loadRun($("run").value);
  $("show").onchange = renderResults;
  $("verify-run").onchange = () => loadVerification($("verify-run").value);
  $("verify-show").onchange = renderConfidence;
  $("dataset-name").onchange = () => loadDataset($("dataset-name").value);
  if ($("run").value) loadRun($("run").value);
})();
</script>
