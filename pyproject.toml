[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "program-behavior-reliability"
version = "0.1.0"
description = "Research on program output prediction, confidence, and program properties"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]
