[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "program-behavior-reliability"
version = "0.1.0"
description = "Research on program output prediction, confidence, and program properties"
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1,<2"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
properties = ["tiktoken==0.14.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["datasets", "scoring", "program_properties", "prompt_template", "model_client", "runs", "metrics", "confidence",
              "execution"]
